name: CI

on:
  push:
    branches: [main, 'ccr-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  motion:
    name: motion_core + game_director (accuracy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: motion_core — analyze
        working-directory: packages/motion_core
        run: dart pub get && dart format --output=none --set-exit-if-changed lib test && dart analyze --fatal-infos
      - name: motion_core — tests + replay accuracy gate
        working-directory: packages/motion_core
        run: dart test --reporter expanded
      - name: game_director — analyze + simulated runs at every difficulty
        working-directory: packages/game_director
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: recorder tool
        working-directory: tools/recorder
        run: dart pub get && dart analyze --fatal-infos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: packages/motion_core/build/accuracy_report.txt

  app:
    name: Flutter app + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bundled levels match content/levels
        run: tools/sync_content.sh && git diff --exit-code app/assets/levels
      - name: Analyze + test
        working-directory: app
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      - name: Build release APKs (ARM only, one per ABI)
        working-directory: app
        # Without upload-key secrets the release build falls back to the
        # debug key (see app/android/app/build.gradle.kts), so this always
        # builds; Play-ready signing comes from MQ_KEYSTORE_* secrets.
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Install size budget (< 150 MB per APK)
        run: |
          shopt -s nullglob
          apks=(app/build/app/outputs/flutter-apk/*-release.apk)
          test "${#apks[@]}" -gt 0 || { echo "no release APKs built"; exit 1; }
          for apk in "${apks[@]}"; do
            size=$(stat -c %s "$apk")
            echo "$(basename "$apk"): $((size / 1024 / 1024)) MB"
            test "$size" -lt $((150 * 1024 * 1024)) || { echo "$apk over budget"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: motionquest-release-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk

  server:
    name: Server (real PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motionquest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/motionquest_test
      TEST_REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:validate
      - run: npm test
      - run: npm run build
