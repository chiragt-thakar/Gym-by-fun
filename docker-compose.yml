# Local development stack. Data stays on this machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: motionquest
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/motionquest
      REDIS_URL: redis://redis:6379
      CONTENT_DIR: /repo/content/levels
    ports: ["8080:8080"]
    depends_on: [postgres, redis]
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/motionquest
      REDIS_URL: redis://redis:6379
      CONTENT_DIR: /repo/content/levels
    depends_on: [postgres, redis]
volumes:
  pgdata:
